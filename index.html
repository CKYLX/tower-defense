<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>塔防对决</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d1117; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e6edf3; touch-action:none; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #cvWrap { position:relative; flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  canvas { display:block; background:#111; touch-action:none; }
  .hidden { display:none !important; }

  #menu { position:fixed; inset:0; background:linear-gradient(160deg,#0d1117,#1a2332); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:30; }
  #menu h1 { font-size:28px; letter-spacing:2px; margin-bottom:6px; color:#f0c060; }
  #menu .sub { color:#8b949e; font-size:13px; margin-bottom:28px; }
  .big-btn { width:230px; padding:14px; margin:8px; font-size:17px; border-radius:12px; border:1px solid #30363d; background:#21262d; color:#e6edf3; cursor:pointer; text-align:center; }
  .big-btn:active { background:#30363d; }
  .big-btn.primary { background:#238636; border-color:#2ea043; color:#fff; }
  .howto { margin-top:22px; font-size:11px; line-height:1.8; text-align:center; max-width:320px; color:#8b949e; }

  #hud { flex:0 0 auto; background:#161b22; border-top:1px solid #30363d; padding:6px 10px; z-index:10; }
  .hud-row { display:flex; align-items:center; justify-content:space-between; font-size:12px; margin:3px 0; }
  .bar { flex:1; height:9px; background:#21262d; border-radius:5px; overflow:hidden; margin:0 8px; }
  .bar > i { display:block; height:100%; background:#f85149; transition:width .15s; }
  .gold { color:#f0c060; font-weight:bold; }

  #recruit { flex:0 0 auto; display:flex; gap:6px; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:#161b22; border-top:1px solid #30363d; overflow-x:auto; z-index:10; }
  .card { flex:0 0 58px; height:70px; border-radius:10px; border:1px solid #30363d; background:#21262d; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:grab; position:relative; touch-action:none; }
  .card:active { cursor:grabbing; }
  .card .ico { font-size:24px; line-height:1; }
  .card .nm { font-size:10px; margin-top:2px; }
  .card .cost { font-size:9px; color:#f0c060; }
  .card .cd { position:absolute; inset:0; background:rgba(0,0,0,.55); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; color:#fff; }
  .card.off { opacity:.38; }

  #result { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:40; }
  #result .box { background:#161b22; border:1px solid #30363d; border-radius:14px; padding:24px 28px; text-align:center; min-width:260px; }
  #result h2 { font-size:24px; margin-bottom:8px; }
  #result .msg { font-size:14px; color:#8b949e; margin-bottom:18px; line-height:1.6; }

  .tip { position:fixed; top:14%; left:50%; transform:translateX(-50%); background:#30363d; color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; z-index:50; pointer-events:none; transition:opacity .3s; }
</style>
</head>
<body>
<div id="app">
  <div id="cvWrap"><canvas id="cv"></canvas></div>
  <div id="hud" class="hidden">
    <div class="hud-row">
      <span id="roleTag" style="color:#58a6ff;font-weight:bold;"></span>
      <span id="timer" style="color:#8b949e;"></span>
    </div>
    <div class="hud-row">
      <span style="font-size:11px;">👑敌方国王</span>
      <div class="bar"><i id="kingBar" style="width:100%"></i></div>
      <span class="gold">💰<span id="goldTxt">0</span></span>
    </div>
  </div>
  <div id="recruit" class="hidden"></div>
</div>

<div id="menu">
  <h1>塔防对决</h1>
  <div class="sub">1v1 实时塔防 · 竖屏 · 无真人自动匹配 AI</div>
  <div class="big-btn primary" onclick="startGame('def')">🛡️ 选择防守方</div>
  <div class="big-btn" onclick="startGame('atk')">⚔️ 选择进攻方</div>
  <div class="howto">
    守方：拖兵种卡到格子上布防，撑过 5 分钟赢<br>
    攻方：拖兵种卡到兵线上出兵，推倒国王赢<br>
    金币靠击杀获得（无初始金币），小兵免费自动刷
  </div>
</div>

<div id="result" class="hidden">
  <div class="box">
    <h2 id="resTitle"></h2>
    <div class="msg" id="resMsg"></div>
    <div class="big-btn primary" onclick="location.reload()">再来一局</div>
    <div class="big-btn" onclick="location.reload()">返回菜单</div>
  </div>
</div>

<div id="tip" class="tip hidden"></div>

<script>
'use strict';
/* ================= 常量（竖屏世界坐标） ================= */
const W = 540, H = 960;
const KING_Y = 940;        // 防守方国王在底部（世界坐标）
const BASE_Y = 0;          // 进攻方基地在顶部
const KING_HP = 3500;
const GAME_TIME = 300;
const KILL_SOLDIER = 10, KILL_HERO = 35, KILL_CREEP = 5;
const UNIT_R = 13;

// 兵线（竖直列）
const LANE_MIN = 3, LANE_MAX = 5;
const LANE_ADD_COST = 250;

// 格子：每条兵线纵向，从国王往上排
const CELL_BASE = 850;     // 最靠后格子的 y
const CELL_DY = 110;       // 每格间距
const CELLS_INIT = 3;
const SPLIT_COST = [200, 400];   // 分裂第4、5格费用

// 兵种
const TYPES = {
  soldier: { name:'小兵', ico:'🗡️', hp:30,  atk:8,  cd:700,  range:110, cost:0,   slow:0, desc:'近战，只打本兵线' },
  archer:  { name:'射手', ico:'🏹', hp:80,  atk:45, cd:1800, range:260, cost:60,  slow:0, desc:'远程，可跨兵线' },
  mage:    { name:'法师', ico:'🔮', hp:70,  atk:30, cd:1500, range:200, cost:70,  slow:1.6, desc:'远程+减速，可跨兵线' },
  warrior: { name:'战士', ico:'⚔️', hp:260, atk:42, cd:1000, range:55,  cost:80,  slow:0, desc:'近战肉盾，只打本兵线' },
};
const SOLDIER_CD = { def: 3, atk: 3 };

const EQUIP = {
  archer:  ['重弩','神臂弓','诸葛连弩','霸王弓','龙舌弓'],
  mage:    ['桃木杖','羽扇','八卦炉','玲珑塔','东皇钟'],
  warrior: ['青铜剑','青龙偃月刀','方天画戟','丈八蛇矛','干将莫邪'],
};

/* ================= 状态 ================= */
let game=null, cv, ctx, raf=null, myRole=null, lastTs=0;
let laneCount = LANE_MIN;
let creepTimer = 0;
let soldierCd = { def:0, atk:0 };
let drag = null;   // { type, sx, sy } 拖拽中的幽灵（屏幕坐标）

function $(id){ return document.getElementById(id); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function toast(m){ const t=$('tip'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),1500); }

/* 世界坐标 <-> 屏幕坐标（进攻方视角上下镜像） */
function sY(worldY){ return myRole==='atk' ? H - worldY : worldY; }
function wY(screenY){ return myRole==='atk' ? H - screenY : screenY; }

function laneCenterX(i){ const cw = W/laneCount; return cw*(i+0.5); }

/* ================= 单位 ================= */
function makeUnit(team,type,lane,y){
  const c=TYPES[type];
  return { id:game.uid++, team, type, lane, x:laneCenterX(lane), y,
    hp:c.hp, maxHp:c.hp, atk:c.atk, cd:c.cd, range:c.range, slow:c.slow,
    atkCd:0, slowUntil:0, homeCell:null };
}

/* ================= 初始化 ================= */
function startGame(role){
  myRole = role;
  game = {
    uid:1, time:0, over:false,
    units:[], cells:[],
    king:{ hp:KING_HP, maxHp:KING_HP },
    gold:{ def:0, atk:0 },
    ai:{ def:{t:0,next:1200}, atk:{t:0,next:800} },
  };
  laneCount = LANE_MIN;
  for(let l=0;l<laneCount;l++){
    for(let i=0;i<CELLS_INIT;i++){
      game.cells.push({ lane:l, idx:i, x:laneCenterX(l), y:CELL_BASE - i*CELL_DY, unit:null });
    }
  }
  drag=null; soldierCd={def:0,atk:0}; creepTimer=4000;
  $('menu').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('recruit').classList.remove('hidden');
  $('roleTag').textContent = role==='def' ? '🛡️ 防守方 · 撑过5分钟' : '⚔️ 进攻方 · 推倒国王';
  buildRecruit();
  initCanvas();
  lastTs = performance.now();
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function initCanvas(){
  cv=$('cv');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr; cv.height=H*dpr;
  ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  function fit(){
    const wrap=$('cvWrap'), w=wrap.clientWidth, h=wrap.clientHeight;
    const s=Math.min(w/W,h/H);
    cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  }
  fit();
  window.addEventListener('resize',fit);
}

/* ================= 招募栏（拖拽卡片） ================= */
function buildRecruit(){
  const box=$('recruit'); box.innerHTML='';
  const list=['soldier','archer','mage','warrior'];
  list.forEach(t=>{
    const c=TYPES[t];
    const d=document.createElement('div');
    d.className='card'; d.id='card_'+t; d.dataset.type=t;
    d.innerHTML='<div class="ico">'+c.ico+'</div><div class="nm">'+c.name+'</div>'+
      '<div class="cost">'+(c.cost>0?'💰'+c.cost:'免费')+'</div>';
    d.addEventListener('pointerdown', e=>startDrag(e,t));
    box.appendChild(d);
  });
  // 分裂卡
  const sp=document.createElement('div');
  sp.className='card'; sp.id='card_split'; sp.dataset.type='split';
  const sc = myRole==='def' ? SPLIT_COST[0] : LANE_ADD_COST;
  sp.innerHTML='<div class="ico">'+(myRole==='def'?'🔲':'➕')+'</div><div class="nm">'+(myRole==='def'?'分裂格子':'增加兵线')+'</div><div class="cost">💰'+sc+'</div>';
  sp.addEventListener('pointerdown', e=>startDrag(e,'split'));
  box.appendChild(sp);
}

/* ================= 拖拽 ================= */
function startDrag(e, type){
  if(!game || game.over) return;
  e.preventDefault();
  const cfg = type==='split' ? null : TYPES[type];
  if(type!=='split'){
    if(type==='soldier'){ if(soldierCd[myRole]>0){ toast('小兵刷新中'); return; } }
    else if(game.gold[myRole] < cfg.cost){ toast('金币不足'); return; }
  } else {
    if(myRole==='def'){
      if(!canSplit()){ toast('格子已满'); return; }
      if(game.gold.def < SPLIT_COST[splittableCount()]){ toast('金币不足'); return; }
    } else {
      if(laneCount>=LANE_MAX){ toast('兵线已满'); return; }
      if(game.gold.atk < LANE_ADD_COST){ toast('金币不足'); return; }
    }
  }
  drag = { type, sx:e.clientX, sy:e.clientY };
  document.body.classList.add('dragging');
}
function moveDrag(e){
  if(!drag) return;
  drag.sx=e.clientX; drag.sy=e.clientY;
}
function endDrag(e){
  if(!drag) return;
  const t=drag.type; drag=null;
  const pos = clientToCanvas(e.clientX, e.clientY);
  if(!pos){ return; }
  if(t==='split'){ placeSplit(pos.lx, pos.ly); }
  else if(myRole==='def'){ placeDef(t, pos.lx, pos.ly); }
  else { placeAtk(t, pos.lx, pos.ly); }
}
function clientToCanvas(cx, cy){
  if(!cv) return null;
  const r=cv.getBoundingClientRect();
  const lx=(cx-r.left)*(W/r.width);
  const ly=(cy-r.top)*(H/r.height);
  if(lx<0||lx>W||ly<0||ly>H) return null;
  return { lx, ly };
}
document.addEventListener('pointermove', moveDrag);
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', ()=>{ drag=null; });

/* ================= 放置 ================= */
function placeDef(type, lx, ly){
  const wy = wY(ly);
  // 找最近的空格子
  let best=null, bd=1e9;
  game.cells.forEach(c=>{
    if(c.unit) return;
    const d=Math.hypot(c.x-lx, c.y-ly);
    if(d<bd){ bd=d; best=c; }
  });
  if(!best || bd>80){ toast('拖到空格子上'); return; }
  const cfg=TYPES[type];
  if(type==='soldier'){ soldierCd.def=SOLDIER_CD.def; }
  else { game.gold.def-=cfg.cost; }
  const u=makeUnit('def',type,best.lane,best.y);
  u.homeCell=best; best.unit=u; game.units.push(u);
}
function placeAtk(type, lx, ly){
  // 找最近的兵线
  let lane=0, bd=1e9;
  for(let i=0;i<laneCount;i++){ const d=Math.abs(laneCenterX(i)-lx); if(d<bd){bd=d; lane=i;} }
  const cfg=TYPES[type];
  if(type==='soldier'){ soldierCd.atk=SOLDIER_CD.atk; }
  else { game.gold.atk-=cfg.cost; }
  const u=makeUnit('atk',type,lane,BASE_Y+20);
  game.units.push(u);
}
function splittableCount(){
  const cnt={}; game.cells.forEach(c=>cnt[c.lane]=(cnt[c.lane]||0)+1);
  let extra=0;
  for(let i=0;i<laneCount;i++){ const n=(cnt[i]||0)-CELLS_INIT; if(n>0) extra+=n; }
  return extra; // 已分裂的总数（用于取费用下标）
}
function canSplit(){
  const cnt={}; game.cells.forEach(c=>cnt[c.lane]=(cnt[c.lane]||0)+1);
  for(let i=0;i<laneCount;i++){ if((cnt[i]||0) < CELLS_INIT+SPLIT_COST.length) return true; }
  return false;
}
function placeSplit(lx, ly){
  if(myRole==='atk'){
    if(laneCount>=LANE_MAX){ toast('兵线已满'); return; }
    if(game.gold.atk<LANE_ADD_COST){ toast('金币不足'); return; }
    game.gold.atk-=LANE_ADD_COST;
    const old=laneCount;
    laneCount++;
    // 重排已有格子/单位的 x
    game.cells.forEach(c=>c.x=laneCenterX(c.lane));
    game.units.forEach(u=>u.x=laneCenterX(u.lane));
    // 新兵线补格子
    for(let i=0;i<CELLS_INIT;i++) game.cells.push({ lane:old, idx:i, x:laneCenterX(old), y:CELL_BASE-i*CELL_DY, unit:null });
    toast('新增第'+(old+1)+'条兵线！');
    return;
  }
  // 防守方：找最近兵线，该兵线加格子
  let lane=0, bd=1e9;
  for(let i=0;i<laneCount;i++){ const d=Math.abs(laneCenterX(i)-lx); if(d<bd){bd=d; lane=i;} }
  const cnt={}; game.cells.forEach(c=>{ if(c.lane===lane) cnt.lane=(cnt.lane||0)+1; });
  const cur=(cnt.lane||0)-CELLS_INIT;
  if(cur>=SPLIT_COST.length){ toast('该兵线已满'); return; }
  const cost=SPLIT_COST[cur];
  if(game.gold.def<cost){ toast('金币不足（需💰'+cost+'）'); return; }
  game.gold.def-=cost;
  const idx=CELLS_INIT+cur;
  game.cells.push({ lane, idx, x:laneCenterX(lane), y:CELL_BASE-idx*CELL_DY, unit:null });
  toast('兵线'+(lane+1)+'新增格子！');
}

/* ================= AI ================= */
function aiStep(role,dt){
  const g=game;
  if(role==='atk'){
    g.ai.atk.t+=dt*1000; if(g.ai.atk.t<g.ai.atk.next) return;
    g.ai.atk.next = rnd(2200,3400);
    const gold=g.gold.atk;
    let type='soldier';
    if(gold>=80 && Math.random()<0.5) type='warrior';
    else if(gold>=60 && Math.random()<0.5) type='archer';
    else if(gold>=70 && Math.random()<0.35) type='mage';
    const c=TYPES[type];
    if(type==='soldier'){ if(soldierCd.atk<=0){ soldierCd.atk=SOLDIER_CD.atk; game.units.push(makeUnit('atk','soldier',ri(0,laneCount-1),BASE_Y+20)); } }
    else if(gold>=c.cost){ g.gold.atk-=c.cost; game.units.push(makeUnit('atk',type,ri(0,laneCount-1),BASE_Y+20)); }
  } else {
    g.ai.def.t+=dt*1000; if(g.ai.def.t<g.ai.def.next) return;
    g.ai.def.next = rnd(1600,2600);
    const gold=g.gold.def;
    const empty=g.cells.filter(c=>!c.unit);
    if(!empty.length) return;
    let type='soldier';
    if(gold>=80 && Math.random()<0.4) type='warrior';
    else if(gold>=60 && Math.random()<0.5) type='archer';
    else if(gold>=70 && Math.random()<0.3) type='mage';
    const c=TYPES[type];
    const cell=empty[ri(0,empty.length-1)];
    if(type==='soldier'){ if(soldierCd.def<=0){ soldierCd.def=SOLDIER_CD.def; const u=makeUnit('def','soldier',cell.lane,cell.y); u.homeCell=cell; cell.unit=u; game.units.push(u); } }
    else if(gold>=c.cost){ g.gold.def-=c.cost; const u=makeUnit('def',type,cell.lane,cell.y); u.homeCell=cell; cell.unit=u; game.units.push(u); }
  }
}

/* ================= 野怪 ================= */
function spawnCreep(){
  const lane=ri(0,laneCount-1);
  game.units.push({ id:game.uid++, team:'creep', type:'creep', lane, x:laneCenterX(lane), y:rnd(300,650),
    hp:100, maxHp:100, atk:0, cd:1e9, range:0, slow:0, atkCd:1e9, slowUntil:0, homeCell:null });
}

/* ================= 主循环 ================= */
function loop(ts){
  if(!game) return;
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  update(dt); render();
  if(!game.over) raf=requestAnimationFrame(loop);
}

function update(dt){
  const g=game;
  if(g.over) return;
  g.time+=dt;
  soldierCd.def=Math.max(0,soldierCd.def-dt);
  soldierCd.atk=Math.max(0,soldierCd.atk-dt);
  creepTimer-=dt*1000;
  if(creepTimer<=0){ creepTimer=rnd(6000,9000); spawnCreep(); }
  if(myRole==='def') aiStep('atk',dt); else aiStep('def',dt);

  // 更新单位
  for(const u of g.units){
    if(u.hp<=0) continue;
    u.atkCd=Math.max(0,u.atkCd-dt*1000);
    const slowed=u.slowUntil>performance.now();
    if(u.team==='atk'){
      const tgt=findTarget(u);
      if(tgt){
        if(tgt.dist>u.range){ u.y+=(slowed?30:60)*dt; }
        else if(u.atkCd<=0){ attack(u,tgt.obj); }
      } else { u.y+=(slowed?30:60)*dt; }
    } else if(u.team==='def'){
      const tgt=findTarget(u);
      if(tgt && u.atkCd<=0 && tgt.dist<=u.range){ attack(u,tgt.obj); }
    }
  }
  // 结算死亡 + 金币
  for(let i=g.units.length-1;i>=0;i--){
    const u=g.units[i];
    if(u.hp<=0){
      if(u.homeCell) u.homeCell.unit=null;
      if(u.team==='def') g.gold.atk+=(u.type==='soldier'?KILL_SOLDIER:KILL_HERO);
      else if(u.team==='atk') g.gold.def+=(u.type==='soldier'?KILL_SOLDIER:KILL_HERO);
      else if(u.team==='creep') g.gold.atk+=KILL_CREEP;
      g.units.splice(i,1);
    }
  }
  // 攻方单位打国王
  for(const u of g.units){
    if(u.team==='atk' && u.hp>0 && u.y>=KING_Y-30){
      if(u.atkCd<=0){ g.king.hp-=u.atk; u.atkCd=u.cd; }
    }
  }
  // 胜负
  if(g.king.hp<=0){ g.king.hp=0; endGame(myRole==='atk'); }
  else if(g.time>=GAME_TIME){ endGame(myRole==='def'); }
}

function findTarget(u){
  let best=null, bd=1e9;
  const targs = (u.team==='def') ? ['atk'] : (u.team==='atk' ? ['def','creep'] : []);
  for(const o of game.units){
    if(o.hp<=0 || o===u) continue;
    if(!targs.includes(o.team)) continue;
    const d=Math.hypot(o.x-u.x, o.y-u.y);
    if(d<bd){ bd=d; best={obj:o,dist:d}; }
  }
  return best;
}

function attack(u,tgt){
  tgt.hp-=u.atk;
  if(u.slow>0) tgt.slowUntil=performance.now()+u.slow*1000;
  u.atkCd=u.cd;
}

/* ================= 胜负 ================= */
function endGame(iWin){
  if(game.over) return;
  game.over=true;
  let title=iWin?'🏆 胜利！':'💀 失败';
  let msg='';
  if(iWin){
    const pool=EQUIP[['archer','mage','warrior'][ri(0,2)]];
    msg='你获得装备：<b style="color:#f0c060">'+pool[ri(0,pool.length-1)]+'</b><br>（装备系统后续版本接入）';
  } else msg='别灰心，再来一局！';
  $('resTitle').textContent=title;
  $('resMsg').innerHTML=msg;
  $('result').classList.remove('hidden');
  if(raf) cancelAnimationFrame(raf);
}

/* ================= 渲染 ================= */
function render(){
  ctx.clearRect(0,0,W,H);
  drawField(); drawCells(); drawKing(); drawUnits(); drawGhost(); drawHUD();
}

function drawField(){
  ctx.fillStyle='#14181f'; ctx.fillRect(0,0,W,H);
  const cw=W/laneCount;
  // 兵线分隔（竖直）
  for(let i=1;i<laneCount;i++){
    const x=i*cw;
    ctx.strokeStyle='rgba(48,54,61,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  // 进攻方基地（顶部，世界 y=BASE_Y）
  const by=sY(BASE_Y);
  ctx.fillStyle='#1f2430';
  ctx.fillRect(0, by-24, W, 48);
  ctx.fillStyle='#8b949e'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText(myRole==='atk'?'我方出兵':'敌方出兵', W/2, by+4);
  ctx.textAlign='left';
  // 国王区域（底部）
  const ky=sY(KING_Y);
  ctx.fillStyle='rgba(248,81,73,.06)';
  ctx.fillRect(0, ky-40, W, 80);
}

function drawCells(){
  for(const c of game.cells){
    const y=sY(c.y);
    ctx.beginPath(); ctx.arc(c.x,y,20,0,Math.PI*2);
    ctx.fillStyle=c.unit?'rgba(240,192,96,.16)':'rgba(56,139,253,.10)';
    ctx.fill();
    ctx.strokeStyle=c.unit?'#f0c060':'#388bfd'; ctx.lineWidth=c.unit?1.5:1;
    ctx.stroke();
    if(!c.unit){ ctx.fillStyle='rgba(56,139,253,.5)'; ctx.beginPath(); ctx.arc(c.x,y,3,0,Math.PI*2); ctx.fill(); }
  }
}

function drawKing(){
  const y=sY(KING_Y);
  ctx.fillStyle='#f85149';
  ctx.beginPath(); ctx.arc(W/2,y,24,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='18px sans-serif'; ctx.textAlign='center';
  ctx.fillText('👑',W/2,y+6);
  ctx.textAlign='left';
}

function drawUnits(){
  for(const u of game.units){
    if(u.hp<=0) continue;
    const y=sY(u.y);
    const cfg = u.type==='creep' ? {ico:'🐗'} : TYPES[u.type];
    const col = u.team==='def' ? '#3fb950' : (u.team==='atk' ? '#f0c060' : '#58a6ff');
    // 血条
    const w=26,h=4;
    ctx.fillStyle='#000'; ctx.fillRect(u.x-w/2,y-UNIT_R-8,w,h);
    ctx.fillStyle=u.team==='atk'?'#f85149':'#3fb950';
    ctx.fillRect(u.x-w/2,y-UNIT_R-8,w*(u.hp/u.maxHp),h);
    // 身体
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(u.x,y,UNIT_R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0d1117'; ctx.lineWidth=2; ctx.stroke();
    if(u.slowUntil>performance.now()){ ctx.strokeStyle='rgba(56,139,253,.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(u.x,y,UNIT_R+4,0,Math.PI*2); ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(cfg.ico,u.x,y+4);
    ctx.textAlign='left';
  }
}

function drawGhost(){
  if(!drag) return;
  const pos=clientToCanvas(drag.sx,drag.sy); if(!pos) return;
  ctx.lineWidth=2.5;
  if(drag.type==='split'){
    if(myRole==='atk'){ ctx.strokeStyle='#fff'; ctx.strokeRect(4,4,W-8,H-8); }
    else {
      let lane=0,bd=1e9;
      for(let i=0;i<laneCount;i++){ const d=Math.abs(laneCenterX(i)-pos.lx); if(d<bd){bd=d;lane=i;} }
      const x=laneCenterX(lane), hw=W/laneCount/2;
      ctx.strokeStyle='#fff'; ctx.strokeRect(x-hw,0,W/laneCount,H);
    }
  } else if(myRole==='def'){
    let best=null,bd=1e9;
    game.cells.forEach(c=>{ if(c.unit) return; const d=Math.hypot(c.x-pos.lx,c.y-pos.ly); if(d<bd){bd=d;best=c;} });
    if(best && bd<80){ ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(best.x,sY(best.y),24,0,Math.PI*2); ctx.stroke(); }
  } else {
    let lane=0,bd=1e9;
    for(let i=0;i<laneCount;i++){ const d=Math.abs(laneCenterX(i)-pos.lx); if(d<bd){bd=d;lane=i;} }
    const x=laneCenterX(lane);
    ctx.strokeStyle='#fff'; ctx.strokeRect(x-W/laneCount/2, sY(BASE_Y)-16, W/laneCount, 32);
  }
  const cfg = drag.type==='split' ? {ico: myRole==='def'?'🔲':'➕'} : TYPES[drag.type];
  ctx.globalAlpha=0.6;
  ctx.fillStyle='#58a6ff'; ctx.beginPath(); ctx.arc(pos.lx,pos.ly,UNIT_R,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText(cfg.ico,pos.lx,pos.ly+4);
  ctx.textAlign='left';
  ctx.globalAlpha=1;
}

function drawHUD(){
  const g=game;
  $('goldTxt').textContent=g.gold[myRole];
  const kp=Math.max(0,g.king.hp/g.king.maxHp*100);
  $('kingBar').style.width=kp+'%';
  const rem=Math.max(0,GAME_TIME-g.time);
  const m=Math.floor(rem/60), s=Math.floor(rem%60);
  $('timer').textContent='⏱ '+m+':'+String(s).padStart(2,'0');
  // 小兵 CD
  const sd=$('card_soldier');
  if(sd){
    let cdEl=sd.querySelector('.cd');
    if(soldierCd[myRole]>0){
      if(!cdEl){ cdEl=document.createElement('div'); cdEl.className='cd'; sd.appendChild(cdEl); }
      cdEl.textContent=soldierCd[myRole].toFixed(1);
    } else if(cdEl) cdEl.remove();
  }
  // 金币不足置灰
  ['soldier','archer','mage','warrior'].forEach(t=>{
    const c=$('card_'+t); if(!c) return;
    const cfg=TYPES[t];
    if(t!=='soldier' && game.gold[myRole]<cfg.cost) c.classList.add('off');
    else c.classList.remove('off');
  });
  // 分裂卡费用显示
  const sp=$('card_split');
  if(sp){
    let cost;
    if(myRole==='def') cost = canSplit() ? SPLIT_COST[Math.min(splittableCount(),SPLIT_COST.length-1)] : '—';
    else cost = LANE_ADD_COST;
    const ce=sp.querySelector('.cost'); if(ce) ce.textContent = (cost==='—')?'已满':'💰'+cost;
    if(myRole==='def' && !canSplit()) sp.classList.add('off'); else sp.classList.remove('off');
  }
}
</script>
