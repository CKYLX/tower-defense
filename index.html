<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>塔防对决</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d1117; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e6edf3; touch-action:none; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #cvWrap { position:relative; flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  canvas { display:block; background:#111; touch-action:none; }
  .hidden { display:none !important; }

  .screen { position:fixed; inset:0; background:linear-gradient(160deg,#0d1117,#1a2332); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:30; overflow-y:auto; padding:16px; }
  .screen h1 { font-size:28px; letter-spacing:2px; margin-bottom:6px; color:#f0c060; }
  .screen .sub { color:#8b949e; font-size:13px; margin-bottom:22px; text-align:center; }
  .big-btn { width:230px; padding:13px; margin:7px; font-size:16px; border-radius:12px; border:1px solid #30363d; background:#21262d; color:#e6edf3; cursor:pointer; text-align:center; }
  .big-btn:active { background:#30363d; }
  .big-btn.primary { background:#238636; border-color:#2ea043; color:#fff; }
  .inp { width:230px; padding:12px; margin:6px; font-size:16px; border-radius:10px; border:1px solid #30363d; background:#161b22; color:#e6edf3; outline:none; text-align:center; }
  .inp:focus { border-color:#388bfd; }
  .chk { font-size:13px; color:#8b949e; margin:10px 0; }
  .back { position:absolute; top:16px; left:16px; font-size:14px; color:#58a6ff; cursor:pointer; z-index:2; }
  .screen .panel { width:100%; max-width:350px; max-height:76vh; overflow-y:auto; }

  .item { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:11px 13px; margin:7px 0; font-size:14px; }
  .item .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .small-btn { padding:6px 11px; font-size:12px; border-radius:8px; border:1px solid #30363d; background:#21262d; color:#e6edf3; cursor:pointer; white-space:nowrap; }
  .small-btn.primary { background:#238636; border-color:#2ea043; }
  .gold { color:#f0c060; font-weight:bold; }
  .dim { color:#8b949e; }

  #hud { flex:0 0 auto; background:#161b22; border-top:1px solid #30363d; padding:6px 10px; z-index:10; }
  .hud-row { display:flex; align-items:center; justify-content:space-between; font-size:12px; margin:3px 0; }
  .bar { flex:1; height:9px; background:#21262d; border-radius:5px; overflow:hidden; margin:0 8px; }
  .bar > i { display:block; height:100%; background:#f85149; transition:width .15s; }

  #recruit { flex:0 0 auto; display:flex; gap:7px; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:#161b22; border-top:1px solid #30363d; overflow-x:auto; z-index:10; }
  .card { flex:0 0 62px; height:74px; border-radius:10px; border:1px solid #30363d; background:#21262d; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:grab; position:relative; touch-action:none; }
  .card:active { cursor:grabbing; }
  .card .ico { font-size:26px; line-height:1; }
  .card .nm { font-size:11px; margin-top:2px; }
  .card .cost { font-size:9px; color:#f0c060; }
  .card .cd { position:absolute; inset:0; background:rgba(0,0,0,.55); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:bold; color:#fff; }
  .card.off { opacity:.38; }

  #result .box { background:#161b22; border:1px solid #30363d; border-radius:14px; padding:24px 28px; text-align:center; min-width:260px; }
  #result h2 { font-size:24px; margin-bottom:8px; }
  #result .msg { font-size:14px; color:#8b949e; margin-bottom:18px; line-height:1.6; }

  .tip { position:fixed; top:14%; left:50%; transform:translateX(-50%); background:#30363d; color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; z-index:50; pointer-events:none; transition:opacity .3s; }
</style>
</head>
<body>
<div id="app">
  <div id="cvWrap"><canvas id="cv"></canvas></div>
  <div id="hud" class="hidden">
    <div class="hud-row">
      <span id="roleTag" style="color:#58a6ff;font-weight:bold;"></span>
      <span id="timer" style="color:#8b949e;"></span>
    </div>
    <div class="hud-row">
      <span style="font-size:11px;">👑敌方国王</span>
      <div class="bar"><i id="kingBar" style="width:100%"></i></div>
      <span class="gold">💰<span id="goldTxt">0</span></span>
    </div>
  </div>
  <div id="recruit" class="hidden"></div>
</div>

<div id="auth" class="screen">
  <h1>塔防对决</h1>
  <div class="sub">注册账号 · 赢装备 · 结缘</div>
  <input id="authName" class="inp" placeholder="名字" maxlength="12">
  <input id="authPass" class="inp" type="password" placeholder="密码" maxlength="20">
  <label class="chk"><input type="checkbox" id="authRemember" checked> 记住密码（下次自动登录）</label>
  <div class="big-btn primary" onclick="doRegister()">注册并进入</div>
  <div class="big-btn" onclick="doLogin()">登录</div>
</div>

<div id="lobby" class="screen hidden">
  <h1>塔防对决</h1>
  <div class="sub" id="lobbyName"></div>
  <div class="big-btn primary" onclick="startGame('def')">🛡️ 开始对局（防守）</div>
  <div class="big-btn" onclick="startGame('atk')">⚔️ 开始对局（进攻）</div>
  <div class="big-btn" onclick="showSpace()">🏠 玩家空间</div>
  <div class="big-btn" onclick="showRel()">💞 结缘</div>
  <div class="big-btn" onclick="logout()">退出登录</div>
</div>

<div id="space" class="screen hidden">
  <span class="back" onclick="showLobby()">← 返回</span>
  <h1 style="font-size:22px;">🏠 玩家空间</h1>
  <div class="sub">装备 5 件同名可合成下一级 · 分解得钻石</div>
  <div class="panel" id="spaceBody"></div>
</div>

<div id="rel" class="screen hidden">
  <span class="back" onclick="showLobby()">← 返回</span>
  <h1 style="font-size:22px;">💞 结缘</h1>
  <div class="sub">单方出 52 钻 · 或双方各出 13+14 钻</div>
  <div class="panel" id="relBody"></div>
</div>

<div id="result" class="screen hidden">
  <div class="box">
    <h2 id="resTitle"></h2>
    <div class="msg" id="resMsg"></div>
    <div class="big-btn primary" onclick="backToLobby()">返回大厅</div>
    <div class="big-btn" onclick="startGame('def')">再来一局（守）</div>
    <div class="big-btn" onclick="startGame('atk')">再来一局（攻）</div>
  </div>
</div>

<div id="tip" class="tip hidden"></div>

<script>
'use strict';
/* ================= 常量（竖屏世界坐标） ================= */
const W = 540, H = 960;
const KING_Y = 940, BASE_Y = 0;
const KING_HP = 3500, GAME_TIME = 300;
const KILL_SOLDIER = 10, KILL_HERO = 35, KILL_CREEP = 5;
const UNIT_R = 17;

const LANE_MIN = 3, LANE_MAX = 5, LANE_ADD_COST = 250;
const CELL_BASE = 890, CELL_DY = 135, CELLS_INIT = 3;
const SPLIT_COST = [200, 400];

const TYPES = {
  soldier: { name:'小兵', ico:'🗡️', hp:30,  atk:8,  cd:700,  range:110, cost:0,   slow:0,   desc:'近战，只打本兵线' },
  archer:  { name:'射手', ico:'🏹', hp:80,  atk:45, cd:1800, range:260, cost:60,  slow:0,   desc:'远程，可跨兵线' },
  mage:    { name:'法师', ico:'🔮', hp:70,  atk:30, cd:1500, range:200, cost:70,  slow:1.6, desc:'远程+减速，可跨兵线' },
  warrior: { name:'战士', ico:'⚔️', hp:260, atk:42, cd:1000, range:55,  cost:80,  slow:0,   desc:'近战肉盾，只打本兵线' },
};
const SOLDIER_CD = { def: 3, atk: 3 };

const EQUIP = {
  archer:  ['重弩','神臂弓','诸葛连弩','霸王弓','龙舌弓'],
  mage:    ['桃木杖','羽扇','八卦炉','玲珑塔','东皇钟'],
  warrior: ['青铜剑','青龙偃月刀','方天画戟','丈八蛇矛','干将莫邪'],
};
const TYPE_ICO = { archer:'🏹', mage:'🔮', warrior:'⚔️' };
const TYPE_NAME = { archer:'射手', mage:'法师', warrior:'战士' };
const EQUIP_VALUE = [1, 5, 25, 125, 625];  // tier 1~5 分解得钻石

/* ================= Supabase 数据层 ================= */
const SUPABASE_URL = 'https://vsyoivroqesxrhruzusu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzeW9pdnJvcWVzeHJocnV6dXN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDQ0MDAsImV4cCI6MjEwMzIyMDQwMH0.umDWcuRLUcDuBiVlUeB2IO3rb0LxkDvf8VqlIENHn9k';
const TD_ROW_ID = 2;
const API_H = { apikey: SUPABASE_KEY, authorization: 'Bearer ' + SUPABASE_KEY };
const API_UPSERT = { apikey: SUPABASE_KEY, authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };

let myId = null, me = null;
let worldCache = { players: {}, queue: [] };

async function loadWorld(){
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/game_state?id=eq.' + TD_ROW_ID + '&select=world', { headers: API_H });
    if(r.ok){ const j = await r.json(); return (j[0] && j[0].world) || { players:{}, queue:[] }; }
  } catch(e){}
  return { players:{}, queue:[] };
}
let saveLock = Promise.resolve();
function saveWorld(w){
  const task = saveLock.then(async ()=>{
    try {
      const r = await fetch(SUPABASE_URL + '/rest/v1/game_state', { method:'POST', headers: API_UPSERT, body: JSON.stringify({ id: TD_ROW_ID, world: w }) });
      return r.ok;
    } catch(e){ return false; }
  });
  saveLock = task.catch(()=>false);
  return task;
}
async function refreshMe(){
  const w = await loadWorld();
  worldCache = w;
  me = w.players[myId] || me;
  return me;
}

/* ================= 工具 ================= */
function $(id){ return document.getElementById(id); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function randHex(n){ let s=''; const c='abcdef0123456789'; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function toast(m){ const t=$('tip'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),1600); }
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function hideScreens(){ ['auth','lobby','space','rel','result'].forEach(id=>$(id).classList.add('hidden')); }

/* ================= 账号 ================= */
function showAuth(){
  hideScreens();
  $('auth').classList.remove('hidden');
}
async function doRegister(){
  const name = $('authName').value.trim();
  const pass = $('authPass').value;
  if(!name || !pass){ toast('请填写名字和密码'); return; }
  if(name.length > 12){ toast('名字最长 12 字'); return; }
  const w = await loadWorld();
  for(const pid in w.players){ if(w.players[pid].name === name){ toast('名字已被使用'); return; } }
  const hash = await sha256(name + ':' + pass);
  const pid = 'td_' + randHex(10);
  w.players[pid] = { id:pid, name, passHash:hash, createdAt:Date.now(), diamonds:0, equipments:[], partnerId:null, relRequests:[] };
  if(!(await saveWorld(w))){ toast('保存失败，请重试'); return; }
  myId = pid; me = w.players[pid];
  localStorage.setItem('td_me', JSON.stringify($('authRemember').checked ? { id:pid, passHash:hash } : { id:pid }));
  showLobby();
}
async function doLogin(){
  const name = $('authName').value.trim();
  const pass = $('authPass').value;
  if(!name || !pass){ toast('请填写名字和密码'); return; }
  const w = await loadWorld();
  const hash = await sha256(name + ':' + pass);
  let found = null;
  for(const pid in w.players){ if(w.players[pid].name === name){ found = w.players[pid]; break; } }
  if(!found || found.passHash !== hash){ toast('名字或密码错误'); return; }
  myId = found.id; me = found;
  localStorage.setItem('td_me', JSON.stringify($('authRemember').checked ? { id:found.id, passHash:hash } : { id:found.id }));
  showLobby();
}
function logout(){
  localStorage.removeItem('td_me');
  myId = null; me = null;
  showAuth();
}
async function showLobby(){
  hideScreens();
  $('lobby').classList.remove('hidden');
  await refreshMe();
  if(!me){ showAuth(); return; }
  $('lobbyName').textContent = '👤 ' + me.name + (me.partnerId ? ' 💞' : '') + ' · 💎' + (me.diamonds||0);
}

/* ================= 玩家空间 ================= */
async function showSpace(){
  hideScreens();
  $('space').classList.remove('hidden');
  await refreshMe();
  renderSpace();
}
function renderSpace(){
  const b = $('spaceBody');
  const pname = me.partnerId && worldCache.players[me.partnerId] ? worldCache.players[me.partnerId].name : null;
  let html = '<div class="item"><div class="row"><span>👤 ' + me.name + '</span><span class="gold">💎 ' + (me.diamonds||0) + '</span></div></div>';
  html += '<div class="item"><div class="row"><span>💞 结缘</span><span class="dim">' + (pname ? ('与 ' + pname + ' 结缘中') : '单身') + '</span></div></div>';
  html += '<div class="item dim" style="text-align:center;">— 我的装备 —</div>';
  const cnt = {};
  (me.equipments||[]).forEach(e=>{ const k = e.type + ':' + e.tier; cnt[k] = (cnt[k]||0) + 1; });
  const keys = Object.keys(cnt);
  if(!keys.length){ html += '<div class="item dim" style="text-align:center;">还没有装备，赢一局就有了</div>'; }
  else {
    keys.forEach(k=>{
      const parts = k.split(':');
      const type = parts[0], t = parseInt(parts[1]);
      const name = EQUIP[type][t-1];
      const canSynth = cnt[k] >= 5 && t < 5;
      html += '<div class="item"><div class="row">' +
        '<span>' + TYPE_ICO[type] + ' ' + name + ' ×' + cnt[k] + '</span>' +
        '<span>' +
          (canSynth ? '<span class="small-btn primary" onclick="synthesize(\'' + type + '\',' + t + ')">5合1</span>' : '') +
          '<span class="small-btn" onclick="decompose(\'' + type + '\',' + t + ')">分解💎' + EQUIP_VALUE[t-1] + '</span>' +
        '</span></div></div>';
    });
  }
  b.innerHTML = html;
}
async function synthesize(type, tier){
  if(tier >= 5){ toast('已是最高级'); return; }
  const w = await loadWorld();
  const p = w.players[myId]; if(!p) return;
  const idxs = [];
  p.equipments.forEach((e,i)=>{ if(e.type===type && e.tier===tier && idxs.length<5) idxs.push(i); });
  if(idxs.length < 5){ toast('需要 5 件 ' + EQUIP[type][tier-1]); return; }
  for(let i=idxs.length-1;i>=0;i--) p.equipments.splice(idxs[i],1);
  p.equipments.push({ name:EQUIP[type][tier], type, tier:tier+1 });
  if(!(await saveWorld(w))){ toast('保存失败'); return; }
  me = p; worldCache.players[myId] = p;
  renderSpace();
  toast('合成成功：' + EQUIP[type][tier] + '！');
}
async function decompose(type, tier){
  const w = await loadWorld();
  const p = w.players[myId]; if(!p) return;
  const idx = p.equipments.findIndex(e=>e.type===type && e.tier===tier);
  if(idx < 0){ toast('没有该装备'); return; }
  p.equipments.splice(idx,1);
  const val = EQUIP_VALUE[tier-1];
  p.diamonds = (p.diamonds||0) + val;
  if(!(await saveWorld(w))){ toast('保存失败'); return; }
  me = p; worldCache.players[myId] = p;
  renderSpace();
  toast('分解 ' + EQUIP[type][tier-1] + ' 得 💎' + val);
}

/* ================= 结缘 ================= */
async function showRel(){
  hideScreens();
  $('rel').classList.remove('hidden');
  await refreshMe();
  renderRel();
}
function renderRel(){
  const b = $('relBody');
  const pname = me.partnerId && worldCache.players[me.partnerId] ? worldCache.players[me.partnerId].name : null;
  let html = '';
  if(pname){
    html += '<div class="item" style="text-align:center;">💞 你已与 <b>' + pname + '</b> 结缘</div>';
  } else {
    html += '<div class="item"><div class="row"><input id="relName" class="inp" style="width:150px;margin:0;" placeholder="对方名字" maxlength="12"><span class="small-btn primary" onclick="relRequest(\'single\')">单方结缘💎52</span></div></div>';
    html += '<div class="item"><div class="row"><span class="dim" style="font-size:12px;">双方各出（对方接受时扣💎14）</span><span class="small-btn" onclick="relRequest(\'mutual\')">双方结缘💎13</span></div></div>';
  }
  const reqs = me.relRequests || [];
  if(reqs.length){
    html += '<div class="item dim" style="text-align:center;">— 收到的结缘请求 —</div>';
    reqs.forEach(r=>{
      const modeTxt = r.mode === 'single' ? '单方' : '双方(需你💎14)';
      html += '<div class="item"><div class="row"><span>' + r.fromName + ' 想与你结缘（' + modeTxt + '）</span><span class="small-btn primary" onclick="relAccept(\'' + r.fromId + '\')">接受</span></div></div>';
    });
  }
  b.innerHTML = html;
}
async function relRequest(mode){
  const name = ($('relName') && $('relName').value.trim()) || '';
  if(!name){ toast('请输入对方名字'); return; }
  const w = await loadWorld();
  const p = w.players[myId]; if(!p) return;
  if(p.partnerId){ toast('你已有伴侣'); return; }
  let target = null;
  for(const pid in w.players){ if(w.players[pid].name === name){ target = w.players[pid]; break; } }
  if(!target){ toast('找不到该玩家'); return; }
  if(target.id === myId){ toast('不能和自己结缘'); return; }
  if(target.partnerId){ toast('对方已有伴侣'); return; }
  const cost = mode === 'single' ? 52 : 13;
  if((p.diamonds||0) < cost){ toast('钻石不足（需💎' + cost + '）'); return; }
  target.relRequests = target.relRequests || [];
  if(target.relRequests.some(r=>r.fromId === myId)){ toast('已发过请求'); return; }
  p.diamonds -= cost;
  target.relRequests.push({ fromId: myId, fromName: p.name, mode });
  if(!(await saveWorld(w))){ toast('保存失败'); return; }
  me = p; worldCache = w;
  renderRel();
  toast('已向 ' + name + ' 发出结缘请求');
}
async function relAccept(fromId){
  const w = await loadWorld();
  const p = w.players[myId]; if(!p) return;
  const req = (p.relRequests||[]).find(r=>r.fromId === fromId);
  if(!req){ toast('请求不存在'); return; }
  const other = w.players[fromId];
  if(!other){ toast('对方不存在'); return; }
  if(p.partnerId || other.partnerId){ toast('有一方已有伴侣'); return; }
  if(req.mode === 'mutual'){
    if((p.diamonds||0) < 14){ toast('钻石不足（需💎14）'); return; }
    p.diamonds -= 14;
  }
  p.partnerId = fromId; other.partnerId = myId;
  p.relRequests = (p.relRequests||[]).filter(r=>r.fromId !== fromId);
  if(!(await saveWorld(w))){ toast('保存失败'); return; }
  me = p; worldCache = w;
  renderRel(); showLobby();
  toast('结缘成功！💞');
}

/* ================= 游戏状态 ================= */
let game=null, cv, ctx, raf=null, myRole=null, lastTs=0;
let laneCount = LANE_MIN;
let creepTimer = 0;
let soldierCd = { def:0, atk:0 };
let drag = null;
let fitFn = null;

function sY(worldY){ return myRole==='atk' ? H - worldY : worldY; }
function wY(screenY){ return myRole==='atk' ? H - screenY : screenY; }
function laneCenterX(i){ const cw = W/laneCount; return cw*(i+0.5); }

function makeUnit(team,type,lane,y){
  const c=TYPES[type];
  return { id:game.uid++, team, type, lane, x:laneCenterX(lane), y,
    hp:c.hp, maxHp:c.hp, atk:c.atk, cd:c.cd, range:c.range, slow:c.slow,
    atkCd:0, slowUntil:0, homeCell:null };
}

function startGame(role){
  myRole = role;
  game = {
    uid:1, time:0, over:false,
    units:[], cells:[],
    king:{ hp:KING_HP, maxHp:KING_HP },
    gold:{ def:0, atk:0 },
    ai:{ def:{t:0,next:1200}, atk:{t:0,next:800} },
  };
  laneCount = LANE_MIN;
  for(let l=0;l<laneCount;l++){
    for(let i=0;i<CELLS_INIT;i++){
      game.cells.push({ lane:l, idx:i, x:laneCenterX(l), y:CELL_BASE - i*CELL_DY, unit:null });
    }
  }
  drag=null; soldierCd={def:0,atk:0}; creepTimer=4000;
  hideScreens();
  $('hud').classList.remove('hidden');
  $('recruit').classList.remove('hidden');
  $('roleTag').textContent = role==='def' ? '🛡️ 防守方 · 撑过5分钟' : '⚔️ 进攻方 · 推倒国王';
  buildRecruit();
  initCanvas();
  lastTs = performance.now();
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function initCanvas(){
  cv=$('cv');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr; cv.height=H*dpr;
  ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!fitFn){
    fitFn=function(){
      const wrap=$('cvWrap'), w=wrap.clientWidth, h=wrap.clientHeight;
      const s=Math.min(w/W,h/H);
      cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
    };
    window.addEventListener('resize',fitFn);
  }
  fitFn();
}

function buildRecruit(){
  const box=$('recruit'); box.innerHTML='';
  const list=['soldier','archer','mage','warrior'];
  list.forEach(t=>{
    const c=TYPES[t];
    const d=document.createElement('div');
    d.className='card'; d.id='card_'+t; d.dataset.type=t;
    d.innerHTML='<div class="ico">'+c.ico+'</div><div class="nm">'+c.name+'</div>'+
      '<div class="cost">'+(c.cost>0?'💰'+c.cost:'免费')+'</div>';
    d.addEventListener('pointerdown', e=>startDrag(e,t));
    box.appendChild(d);
  });
  const sp=document.createElement('div');
  sp.className='card'; sp.id='card_split'; sp.dataset.type='split';
  const sc = myRole==='def' ? SPLIT_COST[0] : LANE_ADD_COST;
  sp.innerHTML='<div class="ico">'+(myRole==='def'?'🔲':'➕')+'</div><div class="nm">'+(myRole==='def'?'分裂格子':'增加兵线')+'</div><div class="cost">💰'+sc+'</div>';
  sp.addEventListener('pointerdown', e=>startDrag(e,'split'));
  box.appendChild(sp);
}

function startDrag(e, type){
  if(!game || game.over) return;
  e.preventDefault();
  const cfg = type==='split' ? null : TYPES[type];
  if(type!=='split'){
    if(type==='soldier'){ if(soldierCd[myRole]>0){ toast('小兵刷新中'); return; } }
    else if(game.gold[myRole] < cfg.cost){ toast('金币不足'); return; }
  } else {
    if(myRole==='def'){
      if(!canSplit()){ toast('格子已满'); return; }
      if(game.gold.def < SPLIT_COST[splittableCount()]){ toast('金币不足'); return; }
    } else {
      if(laneCount>=LANE_MAX){ toast('兵线已满'); return; }
      if(game.gold.atk < LANE_ADD_COST){ toast('金币不足'); return; }
    }
  }
  drag = { type, sx:e.clientX, sy:e.clientY };
}
function moveDrag(e){ if(!drag) return; drag.sx=e.clientX; drag.sy=e.clientY; }
function endDrag(e){
  if(!drag) return;
  const t=drag.type; drag=null;
  const pos = clientToCanvas(e.clientX, e.clientY);
  if(!pos) return;
  if(t==='split') placeSplit(pos.lx, pos.ly);
  else if(myRole==='def') placeDef(t, pos.lx, pos.ly);
  else placeAtk(t, pos.lx, pos.ly);
}
function clientToCanvas(cx, cy){
  if(!cv) return null;
  const r=cv.getBoundingClientRect();
  const lx=(cx-r.left)*(W/r.width);
  const ly=(cy-r.top)*(H/r.height);
  if(lx<0||lx>W||ly<0||ly>H) return null;
  return { lx, ly };
}
document.addEventListener('pointermove', moveDrag);
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', ()=>{ drag=null; });

function placeDef(type, lx, ly){
  let best=null, bd=1e9;
  game.cells.forEach(c=>{
    if(c.unit) return;
    const d=Math.hypot(c.x-lx, c.y-ly);
    if(d<bd){ bd=d; best=c; }
  });
  if(!best || bd>90){ toast('拖到空格子上'); return; }
  const cfg=TYPES[type];
  if(type==='soldier') soldierCd.def=SOLDIER_CD.def;
  else game.gold.def-=cfg.cost;
  const u=makeUnit('def',type,best.lane,best.y);
  u.homeCell=best; best.unit=u; game.units.push(u);
}
function placeAtk(type, lx, ly){
  let lane=0, bd=1e9;
  for(let i=0;i<laneCount;i++){ const d=Math.abs(laneCenterX(i)-lx); if(d<bd){bd=d; lane=i;} }
  const cfg=TYPES[type];
  if(type==='soldier') soldierCd.atk=SOLDIER_CD.atk;
  else game.gold.atk-=cfg.cost;
  const u=makeUnit('atk',type,lane,BASE_Y+20);
  game.units.push(u);
}
function splittableCount(){
  const cnt={}; game.cells.forEach(c=>cnt[c.lane]=(cnt[c.lane]||0)+1);
  let extra=0;
  for(let i=0;i<laneCount;i++){ const n=(cnt[i]||0)-CELLS_INIT; if(n>0) extra+=n; }
  return extra;
}
function canSplit(){
  const cnt={}; game.cells.forEach(c=>cnt[c.lane]=(cnt[c.lane]||0)+1);
  for(let i=0;i<laneCount;i++){ if((cnt[i]||0) < CELLS_INIT+SPLIT_COST.length) return true; }
  return false;
}
function placeSplit(lx, ly){
  if(myRole==='atk'){
    if(laneCount>=LANE_MAX){ toast('兵线已满'); return; }
    if(game.gold.atk<LANE_ADD_COST){ toast('金币不足'); return; }
    game.gold.atk-=LANE_ADD_COST;
    const old=laneCount;
    laneCount++;
    game.cells.forEach(c=>c.x=laneCenterX(c.lane));
    game.units.forEach(u=>u.x=laneCenterX(u.lane));
    for(let i=0;i<CELLS_INIT;i++) game.cells.push({ lane:old, idx:i, x:laneCenterX(old), y:CELL_BASE-i*CELL_DY, unit:null });
    toast('新增第'+(old+1)+'条兵线！');
    return;
  }
  let lane=0, bd=1e9;
  for(let i=0;i<laneCount;i++){ const d=Math.abs(laneCenterX(i)-lx); if(d<bd){bd=d; lane=i;} }
  const cnt={}; game.cells.forEach(c=>{ if(c.lane===lane) cnt.lane=(cnt.lane||0)+1; });
  const cur=(cnt.lane||0)-CELLS_INIT;
  if(cur>=SPLIT_COST.length){ toast('该兵线已满'); return; }
  const cost=SPLIT_COST[cur];
  if(game.gold.def<cost){ toast('金币不足（需💰'+cost+'）'); return; }
  game.gold.def-=cost;
  const idx=CELLS_INIT+cur;
  game.cells.push({ lane, idx, x:laneCenterX(lane), y:CELL_BASE-idx*CELL_DY, unit:null });
  toast('兵线'+(lane+1)+'新增格子！');
}

function aiStep(role,dt){
  const g=game;
  if(role==='atk'){
    g.ai.atk.t+=dt*1000; if(g.ai.atk.t<g.ai.atk.next) return;
    g.ai.atk.next = rnd(2200,3400);
    const gold=g.gold.atk;
    let type='soldier';
    if(gold>=80 && Math.random()<0.5) type='warrior';
    else if(gold>=60 && Math.random()<0.5) type='archer';
    else if(gold>=70 && Math.random()<0.35) type='mage';
    const c=TYPES[type];
    if(type==='soldier'){ if(soldierCd.atk<=0){ soldierCd.atk=SOLDIER_CD.atk; game.units.push(makeUnit('atk','soldier',ri(0,laneCount-1),BASE_Y+20)); } }
    else if(gold>=c.cost){ g.gold.atk-=c.cost; game.units.push(makeUnit('atk',type,ri(0,laneCount-1),BASE_Y+20)); }
  } else {
    g.ai.def.t+=dt*1000; if(g.ai.def.t<g.ai.def.next) return;
    g.ai.def.next = rnd(1600,2600);
    const gold=g.gold.def;
    const empty=g.cells.filter(c=>!c.unit);
    if(!empty.length) return;
    let type='soldier';
    if(gold>=80 && Math.random()<0.4) type='warrior';
    else if(gold>=60 && Math.random()<0.5) type='archer';
    else if(gold>=70 && Math.random()<0.3) type='mage';
    const c=TYPES[type];
    const cell=empty[ri(0,empty.length-1)];
    if(type==='soldier'){ if(soldierCd.def<=0){ soldierCd.def=SOLDIER_CD.def; const u=makeUnit('def','soldier',cell.lane,cell.y); u.homeCell=cell; cell.unit=u; game.units.push(u); } }
    else if(gold>=c.cost){ g.gold.def-=c.cost; const u=makeUnit('def',type,cell.lane,cell.y); u.homeCell=cell; cell.unit=u; game.units.push(u); }
  }
}

function spawnCreep(){
  const lane=ri(0,laneCount-1);
  game.units.push({ id:game.uid++, team:'creep', type:'creep', lane, x:laneCenterX(lane), y:rnd(300,650),
    hp:100, maxHp:100, atk:0, cd:1e9, range:0, slow:0, atkCd:1e9, slowUntil:0, homeCell:null });
}

function loop(ts){
  if(!game) return;
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  update(dt); render();
  if(!game.over) raf=requestAnimationFrame(loop);
}

function update(dt){
  const g=game;
  if(g.over) return;
  g.time+=dt;
  soldierCd.def=Math.max(0,soldierCd.def-dt);
  soldierCd.atk=Math.max(0,soldierCd.atk-dt);
  creepTimer-=dt*1000;
  if(creepTimer<=0){ creepTimer=rnd(6000,9000); spawnCreep(); }
  if(myRole==='def') aiStep('atk',dt); else aiStep('def',dt);

  for(const u of g.units){
    if(u.hp<=0) continue;
    u.atkCd=Math.max(0,u.atkCd-dt*1000);
    const slowed=u.slowUntil>performance.now();
    if(u.team==='atk'){
      const tgt=findTarget(u);
      if(tgt){
        if(tgt.dist>u.range){ u.y+=(slowed?30:60)*dt; }
        else if(u.atkCd<=0){ attack(u,tgt.obj); }
      } else { u.y+=(slowed?30:60)*dt; }
    } else if(u.team==='def'){
      const tgt=findTarget(u);
      if(tgt && u.atkCd<=0 && tgt.dist<=u.range){ attack(u,tgt.obj); }
    }
  }
  for(let i=g.units.length-1;i>=0;i--){
    const u=g.units[i];
    if(u.hp<=0){
      if(u.homeCell) u.homeCell.unit=null;
      if(u.team==='def') g.gold.atk+=(u.type==='soldier'?KILL_SOLDIER:KILL_HERO);
      else if(u.team==='atk') g.gold.def+=(u.type==='soldier'?KILL_SOLDIER:KILL_HERO);
      else if(u.team==='creep') g.gold.atk+=KILL_CREEP;
      g.units.splice(i,1);
    }
  }
  for(const u of g.units){
    if(u.team==='atk' && u.hp>0 && u.y>=KING_Y-30){
      if(u.atkCd<=0){ g.king.hp-=u.atk; u.atkCd=u.cd; }
    }
  }
  if(g.king.hp<=0){ g.king.hp=0; endGame(myRole==='atk'); }
  else if(g.time>=GAME_TIME){ endGame(myRole==='def'); }
}

function findTarget(u){
  let best=null, bd=1e9;
  const targs = (u.team==='def') ? ['atk'] : (u.team==='atk' ? ['def','creep'] : []);
  for(const o of game.units){
    if(o.hp<=0 || o===u) continue;
    if(!targs.includes(o.team)) continue;
    const d=Math.hypot(o.x-u.x, o.y-u.y);
    if(d<bd){ bd=d; best={obj:o,dist:d}; }
  }
  return best;
}
function attack(u,tgt){
  tgt.hp-=u.atk;
  if(u.slow>0) tgt.slowUntil=performance.now()+u.slow*1000;
  u.atkCd=u.cd;
}

function endGame(iWin){
  if(game.over) return;
  game.over=true;
  if(iWin){
    const type = ['archer','mage','warrior'][ri(0,2)];
    const ename = EQUIP[type][0];
    $('resTitle').textContent = '🏆 胜利！';
    $('resMsg').innerHTML = '你获得装备：<b style="color:#f0c060">' + TYPE_ICO[type] + ' ' + ename + '</b><br>已存入玩家空间';
    grantEquipment(ename, type);
  } else {
    $('resTitle').textContent = '💀 失败';
    $('resMsg').textContent = '别灰心，再来一局！';
  }
  $('result').classList.remove('hidden');
  if(raf) cancelAnimationFrame(raf);
}
async function grantEquipment(name, type){
  const w = await loadWorld();
  const p = w.players[myId];
  if(!p) return;
  p.equipments = p.equipments || [];
  p.equipments.push({ name, type, tier:1 });
  await saveWorld(w);
}
function backToLobby(){
  $('result').classList.add('hidden');
  $('hud').classList.add('hidden');
  $('recruit').classList.add('hidden');
  game = null;
  if(raf) cancelAnimationFrame(raf);
  showLobby();
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawField(); drawCells(); drawKing(); drawUnits(); drawGhost(); drawHUD();
}
function drawField(){
  ctx.fillStyle='#14181f'; ctx.fillRect(0,0,W,H);
  const cw=W/laneCount;
  for(let i=1;i<laneCount;i++){
    const x=i*cw;
    ctx.strokeStyle='rgba(48,54,61,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  const by=sY(BASE_Y);
  ctx.fillStyle='#1f2430';
  ctx.fillRect(0, by-24, W, 48);
  ctx.fillStyle='#8b949e'; ctx.font='12px sans-serif'; ctx.textAlign='center';
  ctx.fillText(myRole==='atk'?'我方出兵':'敌方出兵', W/2, by+4);
  ctx.textAlign='left';
  const ky=sY(KING_Y);
  ctx.fillStyle='rgba(248,81,73,.06)';
  ctx.fillRect(0, ky-40, W, 80);
}
function drawCells(){
  for(const c of game.cells){
    const y=sY(c.y);
    ctx.beginPath(); ctx.arc(c.x,y,27,0,Math.PI*2);
    ctx.fillStyle=c.unit?'rgba(240,192,96,.18)':'rgba(56,139,253,.12)';
    ctx.fill();
    ctx.strokeStyle=c.unit?'#f0c060':'#388bfd'; ctx.lineWidth=c.unit?2:1.5;
    ctx.stroke();
    if(!c.unit){ ctx.fillStyle='rgba(56,139,253,.6)'; ctx.beginPath(); ctx.arc(c.x,y,4,0,Math.PI*2); ctx.fill(); }
  }
}
function drawKing(){
  const y=sY(KING_Y);
  ctx.fillStyle='#f85149';
  ctx.beginPath(); ctx.arc(W/2,y,30,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='22px sans-serif'; ctx.textAlign='center';
  ctx.fillText('👑',W/2,y+7);
  ctx.textAlign='left';
}
function drawUnits(){
  for(const u of game.units){
    if(u.hp<=0) continue;
    const y=sY(u.y);
    const cfg = u.type==='creep' ? {ico:'🐗'} : TYPES[u.type];
    const col = u.team==='def' ? '#3fb950' : (u.team==='atk' ? '#f0c060' : '#58a6ff');
    const w=32,h=5;
    ctx.fillStyle='#000'; ctx.fillRect(u.x-w/2,y-UNIT_R-9,w,h);
    ctx.fillStyle=u.team==='atk'?'#f85149':'#3fb950';
    ctx.fillRect(u.x-w/2,y-UNIT_R-9,w*(u.hp/u.maxHp),h);
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(u.x,y,UNIT_R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0d1117'; ctx.lineWidth=2.5; ctx.stroke();
    if(u.slowUntil>performance.now()){ ctx.strokeStyle='rgba(56,139,253,.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(u.x,y,UNIT_R+4,0,Math.PI*2); ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText(cfg.ico,u.x,y+4);
    ctx.textAlign='left';
  }
}
function drawGhost(){
  if(!drag) return;
  const pos=clientToCanvas(drag.sx,drag.sy); if(!pos) return;
  ctx.lineWidth=2.5;
  if(drag.type==='split'){
    if(myRole==='atk'){ ctx.strokeStyle='#fff'; ctx.strokeRect(4,4,W-8,H-8); }
    else {
      let lane=0,bd=1e9;
      for(let i=0;i<laneCount;i++){ const d=Math.abs(laneCenterX(i)-pos.lx); if(d<bd){bd=d;lane=i;} }
      const x=laneCenterX(lane);
      ctx.strokeStyle='#fff'; ctx.strokeRect(x-W/laneCount/2,0,W/laneCount,H);
    }
  } else if(myRole==='def'){
    let best=null,bd=1e9;
    game.cells.forEach(c=>{ if(c.unit) return; const d=Math.hypot(c.x-pos.lx,c.y-pos.ly); if(d<bd){bd=d;best=c;} });
    if(best && bd<90){ ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(best.x,sY(best.y),31,0,Math.PI*2); ctx.stroke(); }
  } else {
    let lane=0,bd=1e9;
    for(let i=0;i<laneCount;i++){ const d=Math.abs(laneCenterX(i)-pos.lx); if(d<bd){bd=d;lane=i;} }
    const x=laneCenterX(lane);
    ctx.strokeStyle='#fff'; ctx.strokeRect(x-W/laneCount/2, sY(BASE_Y)-16, W/laneCount, 32);
  }
  const cfg = drag.type==='split' ? {ico: myRole==='def'?'🔲':'➕'} : TYPES[drag.type];
  ctx.globalAlpha=0.6;
  ctx.fillStyle='#58a6ff'; ctx.beginPath(); ctx.arc(pos.lx,pos.ly,UNIT_R,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='13px sans-serif'; ctx.textAlign='center';
  ctx.fillText(cfg.ico,pos.lx,pos.ly+4);
  ctx.textAlign='left';
  ctx.globalAlpha=1;
}
function drawHUD(){
  const g=game;
  $('goldTxt').textContent=g.gold[myRole];
  const kp=Math.max(0,g.king.hp/g.king.maxHp*100);
  $('kingBar').style.width=kp+'%';
  const rem=Math.max(0,GAME_TIME-g.time);
  const m=Math.floor(rem/60), s=Math.floor(rem%60);
  $('timer').textContent='⏱ '+m+':'+String(s).padStart(2,'0');
  const sd=$('card_soldier');
  if(sd){
    let cdEl=sd.querySelector('.cd');
    if(soldierCd[myRole]>0){
      if(!cdEl){ cdEl=document.createElement('div'); cdEl.className='cd'; sd.appendChild(cdEl); }
      cdEl.textContent=soldierCd[myRole].toFixed(1);
    } else if(cdEl) cdEl.remove();
  }
  ['soldier','archer','mage','warrior'].forEach(t=>{
    const c=$('card_'+t); if(!c) return;
    const cfg=TYPES[t];
    if(t!=='soldier' && game.gold[myRole]<cfg.cost) c.classList.add('off');
    else c.classList.remove('off');
  });
  const sp=$('card_split');
  if(sp){
    let cost;
    if(myRole==='def') cost = canSplit() ? SPLIT_COST[Math.min(splittableCount(),SPLIT_COST.length-1)] : '—';
    else cost = LANE_ADD_COST;
    const ce=sp.querySelector('.cost'); if(ce) ce.textContent = (cost==='—')?'已满':'💰'+cost;
    if(myRole==='def' && !canSplit()) sp.classList.add('off'); else sp.classList.remove('off');
  }
}

/* ================= 启动 ================= */
(async function init(){
  try {
    const saved = localStorage.getItem('td_me');
    if(saved){
      const s = JSON.parse(saved);
      const w = await loadWorld();
      if(w.players[s.id]){ myId = s.id; me = w.players[s.id]; showLobby(); return; }
    }
  } catch(e){}
  showAuth();
})();
</script>
